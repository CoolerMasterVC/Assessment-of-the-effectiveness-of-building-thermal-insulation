<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Material.Name}}</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <span>🏠</span>
            </a>
            <a href="/cart" class="cart-link">
                📋 Корзина
            </a>
        </div>
    </header>

    <main class="container">
        <div class="material-detail">
            <img src="{{.Material.ImageURL}}" alt="{{.Material.Name}}" class="material-detail-image">
            <div class="material-detail-info">
                <h1>{{.Material.Name}}</h1>
                <p class="price">Цена: {{.Material.PricePerM2}} руб./м²</p>
                <p class="lambda">Коэффициент теплопроводности: {{.Material.Lambda}} Вт/(м·K)</p>
                <p class="description">{{.Material.Description}}</p>
                
                <form action="/cart/add/{{.Material.ID}}" method="POST" class="add-to-cart-form">
                    <label for="area">Площадь утепления (м²):</label>
                    <input type="number" id="area" name="area" value="10" min="1" step="0.1">
                    <button type="submit">Добавить в заявку</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
