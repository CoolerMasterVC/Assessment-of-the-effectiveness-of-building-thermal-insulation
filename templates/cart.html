<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на расчет</title>
    <link rel="stylesheet" href="static\styles\style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <span>🏠</span>
            </a>
        </div>
    </header>

    <main class="container">
        <h1>Заявка #{{.Cart.ID}}</h1>
        
        <div class="cart-items">
            {{ range .CartItems }}
            <div class="cart-item">
                <img src="{{.Material.ImageURL}}" alt="{{.Material.Name}}" class="cart-item-image">
                <div class="cart-item-info">
                    <h3>{{.Material.Name}}</h3>
                    <p>Площадь: {{.Area}} м²</p>
                    <p>Цена: {{.Material.PricePerM2}} руб./м²</p>
                </div>
            </div>
            {{ end }}
        </div>

        <div class="cart-total">
            <h2>Общая экономия энергии: {{printf "%.2f" .Cart.TotalSavings}} руб./месяц</h2>
        </div>

        {{ if not .CartItems }}
        <div class="empty-cart">
            <p>Заявка пуста</p>
            <a href="/">Выбрать материалы</a>
        </div>
        {{ end }}
    </main>
</body>
</html>
