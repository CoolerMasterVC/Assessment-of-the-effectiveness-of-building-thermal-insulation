<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <span>🏠</span>
            </a>
        </div>
    </header>

    <main class="container">
        <div class="main-header">
            <h1>Корзина</h1>
        </div>

        <div class="area-input-section">
            <label for="total-area">Общая площадь утепления (м²):</label>
            <input type="number" id="total-area" name="total-area" value="37.5" readonly>
        </div>
        
        <div class="cart-items">
            {{ range .CartItems }}
            <div class="cart-item">
                <img src="{{.Material.ImageURL}}" alt="{{.Material.Name}}" class="cart-item-image">
                <div class="cart-item-info">
                    <h3>{{.Material.Name}}</h3>
                    <p>Площадь: {{.Area}} м²</p>
                    <p>Цена: {{.Material.PricePerM2}} руб./м²</p>
                    <p class="savings">Экономия энергии: {{printf "%.2f" .Savings}} руб./месяц</p>
                </div>
            </div>
            {{ end }}
        </div>

        {{ if not .CartItems }}
        <div class="empty-cart">
            <p>Корзина пуста</p>
            <a href="/">Выбрать материалы</a>
        </div>
        {{ end }}
    </main>
</body>
</html>
