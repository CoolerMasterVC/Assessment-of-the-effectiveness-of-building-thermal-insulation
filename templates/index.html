<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Теплоизоляционные материалы</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">
                <img src="http://localhost:9000/images/home_icon.png" alt="Главная страница" class="logo-image">
            </a>
        </div>
    </header>

    <main class="container">
        <div class="main-header">
            <h1>Теплоизоляционные материалы</h1>
            <form action="/" method="GET" class="search-form">
                <input type="text" name="material_search" placeholder="Поиск материалов..." value="{{ .SearchQuery }}">
                <button type="submit">Найти</button>
            </form>
            {{if .HasDraft}}
            <a href="/materials_aplication/{{.CurrentApplication.ID}}" class="cart-icon">
                <img src="http://localhost:9000/images/cart.png" alt="Заявка" class="cart-material-image">
                <span class="cart-count">{{ .CartCount }}</span>
            </a>
            {{else}}
            <div class="cart-icon" style="opacity: 0.5;">
                <img src="http://localhost:9000/images/cart.png" alt="Заявка" class="cart-material-image">
                <span class="cart-count">0</span>
            </div>
            {{end}}
        </div>
        
        <div class="materials-grid">
            {{ range .Materials }}
            <div class="material-card" onclick="window.location.href='/material/{{.ID}}'" style="cursor: pointer;">
                <img src="{{.ImageURL}}" alt="{{.Name}}" class="material-image">
                <div class="material-info">
                    <h3>{{.Name}}</h3>
                    <div class="material-attributes">
                        <span class="price">{{.PricePerM2}}</span>
                        <span class="lambda">{{.Lambda}}</span>
                    </div>
                    <!-- КНОПКА ДОБАВЛЕНИЯ НА ГЛАВНОЙ -->
                    <form method="POST" action="/material/{{.ID}}/add" class="add-to-cart-form" onclick="event.stopPropagation()">
                        <input type="number" name="area" placeholder="Площадь (м²)" step="0.1" min="0.1" value="10" required>
                        <button type="submit">Добавить в заявку</button>
                    </form>
                </div>
            </div>
            {{ end }}
        </div>

        {{ if not .Materials }}
        <div class="no-results">
            <p>Материалы не найдены</p>
        </div>
        {{ end }}
    </main>
</body>
</html>
